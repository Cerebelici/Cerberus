name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: 'true'

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact_name: Cerberus-macOS-universal.dmg
          - os: ubuntu-24.04
            platform: linux/amd64
            artifact_name: cerberus-sentinel-linux-amd64.deb
          # Native ARM64 Linux (For your Mac VM / Raspberry Pi / ARM servers)
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            artifact_name: cerberus-sentinel-linux-arm64.deb
          - os: windows-latest
            platform: windows/amd64
            artifact_name: Cerberus-Windows-amd64-installer.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Cerberus Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Release Version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          PLAIN_VERSION="${VERSION#v}"
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "PLAIN_VERSION=${PLAIN_VERSION}" >> $GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential nmap unzip

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build Frontend (CerberusFront)
        shell: bash
        run: |
          if [ -d "front" ] && [ -f "front/package.json" ]; then
            cd front
            npm ci || npm install
            npm run build
            cd ..
            rm -rf desktop/frontend/dist
            mkdir -p desktop/frontend/dist
            cp -R front/dist/. desktop/frontend/dist/
          elif [ -f "desktop/frontend/dist/index.html" ]; then
            echo "Pre-built frontend assets present in desktop/frontend/dist"
          fi

      # -----------------------------------------------------------------------
      # ZERO-PREREQUISITE BUNDLED ENGINES PREPARATION (STAGED IN desktop/tools)
      #
      # Windows note: nmap.exe is extracted from the official installer, so no
      # nmap-setup.exe is shipped. Npcap is NOT bundled (its installer must run
      # separately and is licensed by its authors). The app requests elevation via
      # wails.exe.manifest and requires Npcap for raw/SYN scans; there is no
      # connect-scan (-sT) fallback.
      # -----------------------------------------------------------------------
      - name: Prepare Windows Bundled Engines
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/tools/nmap

          # Fetch RustScan Windows x86_64
          Invoke-WebRequest -Uri "https://github.com/bee-san/RustScan/releases/download/2.4.1/x86_64-windows-rustscan.exe.zip" -OutFile "rustscan.zip"
          7z e rustscan.zip -odesktop/tools/ rustscan.exe
          Remove-Item -Force rustscan.zip

          # Extract Portable Nmap Engine from Official Installer
          Invoke-WebRequest -Uri "https://nmap.org/dist/nmap-7.95-setup.exe" -OutFile "nmap-setup.exe"
          7z e nmap-setup.exe -odesktop/tools/nmap nmap.exe libcrypto-3.dll libssl-3.dll libssh2.dll zlibwapi.dll nmap-service-probes nmap-services nmap-os-db -r
          Remove-Item -Force nmap-setup.exe

      - name: Prepare macOS Bundled Engines
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p desktop/tools/nmap

          # Fetch and build Universal RustScan binary (Apple Silicon + Intel)
          curl -sL -O "https://github.com/bee-san/RustScan/releases/download/2.4.1/aarch64-macos-rustscan.tar.gz.zip"
          curl -sL -O "https://github.com/bee-san/RustScan/releases/download/2.4.1/x86_64-macos-rustscan.tar.gz.zip"
          unzip -q aarch64-macos-rustscan.tar.gz.zip && tar -xzf aarch64-macos-rustscan.tar.gz && mv rustscan rustscan_arm64
          unzip -q x86_64-macos-rustscan.tar.gz.zip && tar -xzf x86_64-macos-rustscan.tar.gz && mv rustscan rustscan_x86
          lipo -create rustscan_arm64 rustscan_x86 -output desktop/tools/rustscan
          chmod +x desktop/tools/rustscan
          rm -f rustscan_arm64 rustscan_x86 *.tar.gz *.zip

          # Extract Official Standalone macOS Nmap binary and data files
          rm -rf /tmp/nmap_extract /tmp/nmap_mnt
          mkdir -p /tmp/nmap_mnt
          if curl -sL -f -o /tmp/nmap-7.95.dmg https://nmap.org/dist/nmap-7.95.dmg; then
            hdiutil attach /tmp/nmap-7.95.dmg -nobrowse -mountpoint /tmp/nmap_mnt
            pkgutil --expand /tmp/nmap_mnt/nmap-7.95.mpkg /tmp/nmap_extract
            hdiutil detach /tmp/nmap_mnt 2>/dev/null || true
            rm -f /tmp/nmap-7.95.dmg
            if [ -d "/tmp/nmap_extract/nmap.pkg" ]; then
              (cd /tmp/nmap_extract/nmap.pkg && gzcat Payload | cpio -idm "./bin/nmap" "./share/nmap/*")
              if [ -f "/tmp/nmap_extract/nmap.pkg/bin/nmap" ]; then
                mv /tmp/nmap_extract/nmap.pkg/bin/nmap desktop/tools/nmap/nmap
              fi
              if [ -d "/tmp/nmap_extract/nmap.pkg/share/nmap" ]; then
                mv /tmp/nmap_extract/nmap.pkg/share/nmap/* desktop/tools/nmap/
              fi
              chmod +x desktop/tools/nmap/nmap 2>/dev/null || true
            fi
            rm -rf /tmp/nmap_extract
          fi
          hdiutil detach /tmp/nmap_mnt 2>/dev/null || true
          rm -rf /tmp/nmap_mnt

          # Fallback: if DMG extraction was skipped or failed, download core signatures directly
          if [ ! -f "desktop/tools/nmap/nmap-service-probes" ]; then
            curl -sL -o desktop/tools/nmap/nmap-service-probes https://raw.githubusercontent.com/nmap/nmap/master/nmap-service-probes
            curl -sL -o desktop/tools/nmap/nmap-services https://raw.githubusercontent.com/nmap/nmap/master/nmap-services
          fi
          if [ ! -f "desktop/tools/nmap/nmap" ] && [ -f "/opt/homebrew/bin/nmap" ]; then
            cp /opt/homebrew/bin/nmap desktop/tools/nmap/nmap
          fi

      - name: Prepare Linux Bundled Engines
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p desktop/tools/nmap

          # Fetch architecture-specific RustScan binary
          ARCH="$(uname -m)"
          if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            curl -sL -O "https://github.com/bee-san/RustScan/releases/download/2.4.1/aarch64-linux-rustscan.zip"
            unzip -q aarch64-linux-rustscan.zip
            cp rustscan desktop/tools/
            rm -rf rustscan aarch64-linux-rustscan.zip
          else
            curl -sL -O "https://github.com/bee-san/RustScan/releases/download/2.4.1/x86_64-linux-rustscan.tar.gz.zip"
            unzip -q x86_64-linux-rustscan.tar.gz.zip
            tar -xzf x86_64-linux-rustscan.tar.gz
            cp rustscan desktop/tools/
            rm -rf rustscan *.tar.gz *.zip
          fi

          # Copy system Nmap and probe signatures
          if [ -f "/usr/bin/nmap" ]; then
            cp /usr/bin/nmap desktop/tools/nmap/
          fi
          if [ -d "/usr/share/nmap" ]; then
            cp /usr/share/nmap/nmap-service-probes /usr/share/nmap/nmap-services desktop/tools/nmap/ 2>/dev/null || true
          fi
          chmod -R 0755 desktop/tools

      # -----------------------------------------------------------------------
      # APPLICATION COMPILATION AND PACKAGING
      # -----------------------------------------------------------------------
      - name: Build macOS Application (.app & .dmg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd desktop
          wails build -platform ${{ matrix.platform }} -clean

          APP_DIR="build/bin/cerberus.app"
          if [ ! -d "${APP_DIR}" ] && [ -d "build/bin/Cerberus.app" ]; then
            APP_DIR="build/bin/Cerberus.app"
          fi

          # Inject staged tools into the compiled .app bundle
          mkdir -p "${APP_DIR}/Contents/Resources/bin"
          cp -R tools/* "${APP_DIR}/Contents/Resources/bin/"
          # build-dmg.sh rebuilds, injects and signs the SMJobBless helper. Set
          # CERBERUS_CODESIGN_IDENTITY to a Developer ID for a distributable build; the
          # ad-hoc default cannot bless the helper, so scanning stays disabled in it.
          codesign --force --deep --sign - "${APP_DIR}"

          chmod +x packaging/darwin/build-dmg.sh
          ./packaging/darwin/build-dmg.sh "../${{ matrix.artifact_name }}"

      - name: Build Linux Application (.deb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd desktop
          wails build -platform ${{ matrix.platform }} -tags webkit2_41 -clean

          # Stage tools into build/bin so build-deb.sh includes them
          mkdir -p build/bin/tools
          cp -R tools/* build/bin/tools/

          chmod +x packaging/linux/build-deb.sh
          ./packaging/linux/build-deb.sh "${PLAIN_VERSION}" "../${{ matrix.artifact_name }}"

      - name: Build Windows Application (NSIS Installer)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd desktop

          # Populate tools into build/bin before NSIS runs
          mkdir -p build/bin/tools
          cp -R tools/* build/bin/tools/

          # Build with NSIS (without -clean so staged tools remain intact)
          wails build -platform ${{ matrix.platform }} -nsis

          ls -la build/bin/
          if ls build/bin/*installer.exe 1> /dev/null 2>&1; then
            cp build/bin/*installer.exe ../${{ matrix.artifact_name }}
          elif [ -f "build/bin/cerberus-desktop.exe" ]; then
            cp build/bin/cerberus-desktop.exe ../${{ matrix.artifact_name }}
          elif [ -f "build/bin/Cerberus.exe" ]; then
            cp build/bin/Cerberus.exe ../${{ matrix.artifact_name }}
          elif [ -f "build/bin/cerberus.exe" ]; then
            cp build/bin/cerberus.exe ../${{ matrix.artifact_name }}
          else
            echo "Error: no windows executable found in build/bin/"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Determine Release Tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Cerberus Sentinel ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release_artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
